
<section class="join-page">
  <h1>Join a University Club</h1>

  <p>Complete the form below to register your interest.</p>

  <form #clubForm="ngForm" (ngSubmit)="register()">
    <label for="name">Student Name</label>
    <input
      id="name"
      type="text"
      name="name"
      [(ngModel)]="student.name"
      required
      placeholder="Enter your name"
    />

    <label for="rollNumber">Roll Number</label>
    <input
      id="rollNumber"
      type="text"
      name="rollNumber"
      [(ngModel)]="student.rollNumber"
      required
      placeholder="Enter your roll number"
    />

    <label for="department">Department</label>
    <select
      id="department"
      name="department"
      [(ngModel)]="student.department"
      required
    >
      <option value="">Select Department</option>
      <option value="CSE">CSE</option>
      <option value="ECE">ECE</option>
      <option value="EEE">EEE</option>
      <option value="Mechanical">Mechanical</option>
      <option value="Civil">Civil</option>
    </select>

    <label for="year">Year of Study</label>
    <select
      id="year"
      name="year"
      [(ngModel)]="student.year"
      required
    >
      <option value="">Select Year</option>
      <option value="1st Year">1st Year</option>
      <option value="2nd Year">2nd Year</option>
      <option value="3rd Year">3rd Year</option>
      <option value="4th Year">4th Year</option>
    </select>

    <label for="club">Choose a Club</label>
    <select
      id="club"
      name="club"
      [(ngModel)]="student.club"
      required
    >
      <option value="">Select Club</option>
      <option value="Coding Club">Coding Club</option>
      <option value="Sports Club">Sports Club</option>
      <option value="Cultural Club">Cultural Club</option>
      <option value="Photography Club">Photography Club</option>
    </select>

    <button type="submit" [disabled]="clubForm.invalid">
      Submit Registration
    </button>

    <p class="message" aria-live="polite">{{ message }}</p>
  </form>
</section>
